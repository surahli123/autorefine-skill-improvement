name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  detect-private-submodule-access:
    runs-on: ubuntu-latest
    outputs:
      has_submodule_token: ${{ steps.detect.outputs.has_submodule_token }}

    steps:
      - name: Detect private submodule token
        id: detect
        env:
          CI_SUBMODULE_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
        run: |
          if [ -n "${CI_SUBMODULE_TOKEN}" ]; then
            echo "has_submodule_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_submodule_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_SUBMODULE_TOKEN is not configured; skipping private dev submodule checks."
          fi

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        # httpx is a transitive import of autorefine/scripts/record.py, which
        # test_record_py.py imports; without it pytest collection fails in CI.
        run: python -m pip install --upgrade pip pytest httpx

      - name: Compile shipped runtime helpers
        run: python -m compileall autorefine/lib

      - name: Import shipped runtime helpers
        run: |
          python - <<'PY'
          import autorefine.lib
          print("autorefine.lib import smoke test: ok")
          PY

      - name: Run shipped unit tests
        run: python -m pytest autorefine/tests -q

  verify-private-submodule:
    needs:
      - detect-private-submodule-access
      - verify
    if: needs.detect-private-submodule-access.outputs.has_submodule_token == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch dev submodule
        env:
          CI_SUBMODULE_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
        run: |
          git submodule sync --recursive
          git -c url."https://x-access-token:${CI_SUBMODULE_TOKEN}@github.com/".insteadOf=https://github.com/ \
            submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run internal shell test suite
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "RUN ${test_file}"
            bash "${test_file}"
          done < <(find dev/tests -maxdepth 1 -type f -name 'test*.sh' | sort)
