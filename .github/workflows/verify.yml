name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Require private submodule token
        env:
          CI_SUBMODULE_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
        run: |
          if [ -z "${CI_SUBMODULE_TOKEN}" ]; then
            echo "CI_SUBMODULE_TOKEN is required to fetch the private dev submodule (surahli123/autorefine-dev)." >&2
            echo "Add a repository secret named CI_SUBMODULE_TOKEN with read access to the dev submodule." >&2
            exit 1
          fi

      - name: Fetch dev submodule
        env:
          CI_SUBMODULE_TOKEN: ${{ secrets.CI_SUBMODULE_TOKEN }}
        run: |
          git submodule sync --recursive
          git -c url."https://x-access-token:${CI_SUBMODULE_TOKEN}@github.com/".insteadOf=https://github.com/ \
            submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run bundled pytest
        run: python -m pytest autorefine/tests/test_exemplar_source_loader.py

      - name: Run internal shell test suite
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "RUN ${test_file}"
            bash "${test_file}"
          done < <(find dev/tests -maxdepth 1 -type f -name 'test*.sh' | sort)
